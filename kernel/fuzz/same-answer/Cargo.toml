[package]
name = "fission-same-answer"
version = "0.0.0"
publish = false
edition = "2021"

# Prints the kernel's exact answer for every saved fuzz input (../answers.rs),
# natively (`cargo run --release`) and as WebAssembly for the browser
# (`check.mjs` builds the cdylib for wasm32-unknown-unknown and runs it in
# Node). `check.sh` runs both and fails on any difference.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
fission-kernel = { path = "../.." }
glam = "0.29"

# Keep this crate out of any parent workspace.
[workspace]

# The same settings as the kernel's own (kernel/Cargo.toml), so the
# WebAssembly here is built exactly as the app's (wasm-pack's release).
[profile.release]
opt-level = "s"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(same_answer_break)"] }
