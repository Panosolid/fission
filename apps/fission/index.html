<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fission</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <header id="topbar">
      <h1>Fission <span id="version"></span></h1>
      <nav id="workspaces" aria-label="Workspaces"></nav>

    <main id="workspace">
      <aside id="panel"></aside>
      <div id="viewport"></div>
      <aside id="assistant" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
