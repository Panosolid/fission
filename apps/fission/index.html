<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Content Security Policy (audit S10): scripts only from this site (and WebAssembly), no plugins, no <base> or form tricks. connect-src stays open: the AI assistant talks to an address the user types. frame-ancestors can't be set here; src/frame-guard.ts refuses frames instead. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' http: https: ws: wss: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpindleLabs</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <header id="topbar">
      <h1 class="save-mark">SpindleLabs <span id="version"></span></h1>
      <nav id="workspaces" class="workspace-tabs" aria-label="Workspaces"></nav>
      <span id="save-status" role="status" aria-live="polite"></span>
      <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="topbar-actions" title="Save, Open, the AI assistant and Community">Menu</button>
      <div id="topbar-actions">
        <div id="undo-redo" class="undo-redo" role="group" aria-label="Undo and redo">
          <button id="undo" type="button" aria-label="Undo" disabled>↶</button>
          <button id="redo" type="button" aria-label="Redo" disabled>↷</button>
        </div>
        <button id="save" type="button" title="Save the whole project as a .spindlelabs.json file">Save</button>
        <button id="open" type="button" title="Open a project or an image">Open</button>
        <input id="open-file" type="file" hidden /><!-- accept: set from the registered importers (src/main.ts) -->
        <button id="assistant-toggle" type="button" aria-pressed="false" title="The optional AI assistant. No AI provider is active: nothing is sent anywhere.">AI <span id="ai-status">off</span></button>
        <button id="guide-open" type="button" title="How SpindleLabs works: a scrolling 3D guide to Design and the kernel">Guide</button>
        <button id="community" type="button" title="Shared models, free to download (coming soon)">Community</button>
      </div>
      <div id="file-notice">
        <span id="file-status" role="alert"></span>
        <button id="opening-fresh" class="opening-fresh" type="button" hidden title="Leave the project being opened and start a new one">Start fresh instead</button>
        <button id="file-dismiss" type="button" title="Hide this message">Dismiss</button>
      </div>
    </header>
    <main id="workspace">
      <div id="toolbar" role="toolbar" aria-label="Tools"></div>
      <div id="panel-toggles" aria-label="Panels">
        <button id="browser-toggle" type="button" aria-controls="browser" aria-expanded="false">Browser</button>
        <button id="properties-toggle" type="button" aria-controls="properties" aria-expanded="true">Properties</button>
      </div>
      <aside id="browser" aria-label="Browser"></aside>
      <div id="viewport"></div>
      <div id="timeline" role="region" aria-label="Timeline"></div>
      <aside id="properties" aria-label="Properties"></aside>
      <section id="split" aria-label="Second workspace" hidden>
        <div id="split-toolbar" role="toolbar" aria-label="Tools of the second workspace"></div>
        <div id="split-bar">
          <label><span class="split-bar-label">Beside it</span> <select id="split-choice" title="The workspace in the second pane"></select></label>
          <button id="split-close" type="button" title="Back to one workspace">Close split</button>
        </div>
        <div id="split-viewport">
          <div class="split-soon" role="status" hidden></div>
        </div>
        <aside id="split-browser" aria-label="Browser of the second workspace"></aside>
        <aside id="split-properties" aria-label="Properties of the second workspace"></aside>
        <div id="split-timeline" role="region" aria-label="Timeline of the second workspace"></div>
      </section>
      <aside id="assistant" hidden></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/guide-button.ts"></script>
  </body>
</html>
