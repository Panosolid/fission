<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<style>

</head><body><canvas id="view"></canvas><div id="info"></div>
<div id="tools"><button id="faces">Hide faces</button><button id="home">Reset view</button></div>
<script>
"use strict";
const note = "step 1 (Add { shape: Extrude { outer: Path { pts: [[0.4114129553232422, -0.2158532418059359], [-0.46277029834421685, -0.31067580458270916], [0.006602779289721038, -0.9999564014048137], [0.9109017887606129, -0.5000000000000002]], bulges: [0.0, 0.0, -0.037739468385515666, 0.0] }, holes: [], dist: 0.0012544491193183115, expect: None, sketch: Some(0) }, axis: [0.0, 0.7577302104144713, -0.4533820205858137], angle: -1.5707963267948966, at: [99999999.0, 0.0, 0.0] }): face 2 (Some(Side(Piece { boundary: 0, piece: 3 }))) centroid is at [99999999.37866585, -0.31181674175331664, 0.7138068526500357] but should be at [99999999.37869722, -0.3118443787241363, 0.7138627677821141] (6.981539477052967e-5 off)\n\nChain:\n1. Add { shape: Extrude { outer: Path { pts: [[0.4114129553232422, -0.2158532418059359], [-0.46277029834421685, -0.31067580458270916], [0.006602779289721038, -0.9999564014048137], [0.9109017887606129, -0.5000000000000002]], bulges: [0.0, 0.0, -0.037739468385515666, 0.0] }, holes: [], dist: 0.0012544491193183115, expect: None, sketch: Some(0) }, axis: [0.0, 0.7577302104144713, -0.4533820205858137], angle: -1.5707963267948966, at: [99999999.0, 0.0, 0.0] }";
const scene = [{"label":"placed","positions":[9.999999951342702e7,-7.329474166057567e-1,4.462478992283941e-1,9.99999992567247e7,9.951711909168726e-2,1.0019634925298937e0,9.999999911082971e7,5.229194476763219e-2,4.4814681530927686e-1,9.99999991595163e7,-4.6638138517843564e-1,-2.602282776786384e-1,9.999999951235054e7,-7.335001283086445e-1,4.465786100080522e-1,9.999999925564823e7,9.896440738879946e-2,1.0022942033095519e0,9.999999910975325e7,5.1739233064744386e-2,4.48477526088935e-1,9.999999915843984e7,-4.669340968813234e-1,-2.5989756689898025e-1,9.999999937631442e7,-3.0899372731902464e-1,7.084917891952625e-1,9.999999937523796e7,-3.0954643902191226e-1,7.088224999749206e-1],"triangles":[0,2,8,1,8,2,3,2,0,4,9,6,5,6,9,7,4,6,4,0,9,8,9,0,5,9,8,1,5,8,1,6,5,2,6,1,7,6,3,2,3,6,0,4,7,3,0,7],"faces":[0,0,0,1,1,1,2,2,2,2,3,3,4,4,5,5],"edges":[[9.999999951342702e7,-7.329474166057567e-1,4.462478992283941e-1,9.999999937631442e7,-3.0899372731902464e-1,7.084917891952625e-1,9.99999992567247e7,9.951711909168726e-2,1.0019634925298937e0],[9.99999992567247e7,9.951711909168726e-2,1.0019634925298937e0,9.999999911082971e7,5.229194476763219e-2,4.4814681530927686e-1],[9.999999911082971e7,5.229194476763219e-2,4.4814681530927686e-1,9.99999991595163e7,-4.6638138517843564e-1,-2.602282776786384e-1],[9.99999991595163e7,-4.6638138517843564e-1,-2.602282776786384e-1,9.999999951342702e7,-7.329474166057567e-1,4.462478992283941e-1],[9.999999951235054e7,-7.335001283086445e-1,4.465786100080522e-1,9.999999937523796e7,-3.0954643902191226e-1,7.088224999749206e-1,9.999999925564823e7,9.896440738879946e-2,1.0022942033095519e0],[9.999999925564823e7,9.896440738879946e-2,1.0022942033095519e0,9.999999910975325e7,5.1739233064744386e-2,4.48477526088935e-1],[9.999999910975325e7,5.1739233064744386e-2,4.48477526088935e-1,9.999999915843984e7,-4.669340968813234e-1,-2.5989756689898025e-1],[9.999999915843984e7,-4.669340968813234e-1,-2.5989756689898025e-1,9.999999951235054e7,-7.335001283086445e-1,4.465786100080522e-1],[9.999999951342702e7,-7.329474166057567e-1,4.462478992283941e-1,9.999999951235054e7,-7.335001283086445e-1,4.465786100080522e-1],[9.99999992567247e7,9.951711909168726e-2,1.0019634925298937e0,9.999999925564823e7,9.896440738879946e-2,1.0022942033095519e0],[9.999999911082971e7,5.229194476763219e-2,4.4814681530927686e-1,9.999999910975325e7,5.1739233064744386e-2,4.48477526088935e-1],[9.99999991595163e7,-4.6638138517843564e-1,-2.602282776786384e-1,9.999999915843984e7,-4.669340968813234e-1,-2.5989756689898025e-1]],"badEdges":[],"badCurves":[],"badFaces":[],"badVertices":[],"meshProblems":[],"errors":[]}];
const RED = [255, 59, 59], colours = [[154, 167, 184], [127, 179, 213], [195, 155, 211], [240, 178, 122]];
const info = document.getElementById("info");
info.innerHTML = "<h1>Failure dump</h1><pre></pre><div>Drag to turn, wheel to zoom. Red: the problems listed; dashed red: where a named edge's curve really runs.</div>";
info.querySelector("pre").textContent = note;
for (const b of scene) {
  const h = document.createElement("div");
  h.innerHTML = `<b></b> ${b.errors.length ? `<span class="bad">${b.errors.length} problem(s)</span>` : "valid"}`;
  h.querySelector("b").textContent = b.label;
  info.appendChild(h);
  for (const e of b.errors) { const p = document.createElement("pre"); p.className = "bad"; p.textContent = e; info.appendChild(p); }
  if (b.meshProblems.length) { const p = document.createElement("pre"); p.className = "bad"; p.textContent = `${b.meshProblems.length / 6} open or flipped mesh edge(s), drawn in red`; info.appendChild(p); }
}
// Everything relative to the middle of the scene, in doubles.
const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
const visit = (a) => { for (let i = 0; i < a.length; i++) if (Number.isFinite(a[i])) { lo[i % 3] = Math.min(lo[i % 3], a[i]); hi[i % 3] = Math.max(hi[i % 3], a[i]); } };
for (const b of scene) { visit(b.positions); b.edges.forEach(visit); visit(b.badVertices); visit(b.meshProblems); }
const centre = lo.map((l, i) => (Number.isFinite(l) ? (l + hi[i]) / 2 : 0));
const radius = Math.max(Number.isFinite(lo[0]) ? Math.hypot(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2 : 1, 1e-9);
const points = (a) => { const out = []; for (let i = 0; i + 2 < a.length; i += 3) out.push([a[i] - centre[0], a[i + 1] - centre[1], a[i + 2] - centre[2]]); return out; };
const tris = [], lines = [], dots = [];
scene.forEach((b, i) => {
  const p = points(b.positions), bad = new Set(b.badFaces), badE = new Set(b.badEdges);
  b.faces.forEach((f, t) => tris.push({ v: [0, 1, 2].map((k) => p[b.triangles[3 * t + k]]), colour: bad.has(f) ? RED : colours[i % colours.length], bad: bad.has(f) }));
  b.edges.forEach((e, k) => lines.push({ v: points(e), bad: badE.has(k) }));
  for (const c of b.badCurves) lines.push({ v: points(c), bad: true, dashed: true });
  const m = points(b.meshProblems);
  for (let k = 0; k + 1 < m.length; k += 2) lines.push({ v: [m[k], m[k + 1]], bad: true });
  dots.push(...points(b.badVertices));
});
lines.sort((a, b) => a.bad - b.bad); // red on top
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const view = { yaw: -1.1, pitch: 0.5, zoom: 1, faces: true };
const home = () => Object.assign(view, { yaw: -1.1, pitch: 0.5, zoom: 1 });
const canvas = document.getElementById("view"), ctx = canvas.getContext("2d");
function draw() {
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#14161a"; ctx.fillRect(0, 0, W, H);
  // Z up: the eye looks back along e; r is screen right, u screen up.
  const cp = Math.cos(view.pitch), e = [cp * Math.cos(view.yaw), cp * Math.sin(view.yaw), Math.sin(view.pitch)];
  const r = [-Math.sin(view.yaw), Math.cos(view.yaw), 0], u = cross(e, r);
  const s = (view.zoom * 0.45 * Math.min(W, H)) / radius;
  const xy = (p) => [W / 2 + s * dot(p, r), H / 2 - s * dot(p, u)];
  let drawn = 0;
  if (view.faces) {
    const order = tris.map((t) => ({ t, d: dot(t.v[0], e) + dot(t.v[1], e) + dot(t.v[2], e) })).sort((a, b) => a.d - b.d);
    for (const { t } of order) {
      if (t.v.some((p) => !p)) continue;
      const n = cross(sub(t.v[1], t.v[0]), sub(t.v[2], t.v[0])), len = Math.hypot(...n) || 1;
      const light = (t.bad ? 0.55 : 0.35) + (t.bad ? 0.45 : 0.65) * Math.abs(dot(n, e) / len);
      const c = `rgb(${t.colour.map((x) => Math.round(x * light)).join(",")})`;
      const [a, b, d] = t.v.map(xy);
      ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...d); ctx.closePath();
      ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineWidth = 0.5; ctx.fill(); ctx.stroke();
      drawn++;
    }
  }
  for (const l of lines) {
    const pts = l.v.filter((p) => p.every(Number.isFinite));
    if (pts.length < 2) continue;
    ctx.beginPath(); ctx.moveTo(...xy(pts[0])); for (const p of pts.slice(1)) ctx.lineTo(...xy(p));
    ctx.strokeStyle = l.bad ? "rgb(255,59,59)" : view.faces ? "#0b0c0e" : "#9aa7b8"; ctx.lineWidth = l.bad ? 3 : 1;
    ctx.setLineDash(l.dashed ? [6, 5] : []); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.fillStyle = "rgb(255,59,59)";
  for (const p of dots) { ctx.beginPath(); ctx.arc(...xy(p), 5, 0, 2 * Math.PI); ctx.fill(); }
  document.body.dataset.triangles = String(drawn);
}
let drag = null;
canvas.addEventListener("pointerdown", (ev) => { drag = [ev.clientX, ev.clientY]; canvas.setPointerCapture(ev.pointerId); });
canvas.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  view.yaw -= (ev.clientX - drag[0]) * 0.01;
  view.pitch = Math.max(-1.55, Math.min(1.55, view.pitch + (ev.clientY - drag[1]) * 0.01));
  drag = [ev.clientX, ev.clientY]; draw();
});
canvas.addEventListener("pointerup", () => { drag = null; });
canvas.addEventListener("wheel", (ev) => { ev.preventDefault(); view.zoom *= Math.exp(-ev.deltaY * 0.001); draw(); }, { passive: false });
document.getElementById("faces").onclick = (ev) => { view.faces = !view.faces; ev.target.textContent = view.faces ? "Hide faces" : "Show faces"; draw(); };
document.getElementById("home").onclick = () => { home(); draw(); };
addEventListener("resize", draw);
draw();
</script></body></html>
