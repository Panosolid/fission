name: Auto-merge

# Merges Claude's pull requests (branches named claude/...) into main by
# itself, once the branch contains the current main and every check on its
# head passed; the rules and why they are safe are in
# .github/scripts/automerge.py. To keep one pull request out, mark it a draft
# or add the `hold` label; to stop all of it, disable this workflow on the
# Actions tab.
#
# It wakes when CI finishes, when a pull request opens, is marked ready or
# drafted, gains or loses a label, leaves the merge queue or merges, every
# half hour as a safety net, and on "Run workflow". Once main's ruleset
# requires the merge queue it steers the queue instead of merging itself
# (automerge.py), and a pull request the queue removes gets a comment naming
# why.
# A pull request in conflict with main for 15 minutes gets one comment per
# head commit naming the conflicted files, for its thread to resolve; a green
# one that is behind main gets one comment per head and main asking its
# thread to merge main in (auto-merge never pushes to a branch: main's
# ruleset only counts CI started by the pull request's own push). A merge
# made with this workflow's token starts no other workflows, so the script
# starts the Pages deploy after merging.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Runs main's copy of this workflow and never checks out the pull
  # request's code, so it is safe with a write token.
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, labeled, unlabeled, dequeued, closed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what it would do"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

jobs:
  # A pull request the merge queue just removed: its comment goes first and
  # outside the one-at-a-time group below, where a newer waiting run would
  # replace this one and the comment would be lost. The merge job then sees
  # the comment and doesn't queue that head again.
  dequeued:
    if: github.event.action == 'dequeued'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: .github/scripts
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEQUEUED_PR: ${{ github.event.pull_request.number }}
          DEQUEUED_HEAD: ${{ github.event.pull_request.head.sha }}
          DEQUEUED_REASON: ${{ github.event.reason }}
        run: python3 .github/scripts/automerge.py --dequeued

  merge:
    needs: dequeued
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time, so two runs never act on the same pull request at once.
    concurrency:
      group: auto-merge
      cancel-in-progress: false
    steps:
      # Every branch, so a conflicted pull request's reminder can name the
      # files git can't merge.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The owner's fine-grained token (Pull requests and Contents: read
          # and write, this repository only), used only to add pull requests
          # to the merge queue and take them out: GitHub runs no CI for a
          # queue entry this workflow's own token makes (automerge.py).
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python3 .github/scripts/automerge.py $DRY_RUN
