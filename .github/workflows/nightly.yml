name: Random testing

# Tier 3, around the clock on GitHub's computers (free for public repos):
# every 6 hours, 4 parallel jobs each run kernel/scripts/endless.sh (the
# stateful harness plus the OpenCascade oracle, a fresh random seed per
# round) for about 5 hours. A final job adds every round to the
# `test-results` branch (log.csv, summary.txt, failures/<seed>/) and opens an
# issue when something new was found. Scheduled runs only fire from the
# default branch; "Run workflow" on the Actions tab starts one by hand.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of testing per job"
        default: "290"

# Runs queue rather than overlap, so two collect jobs never race on the branch.
concurrency:
  group: random-testing
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cadquery-ocp
      - name: Random rounds until the time is up
        working-directory: kernel
        env:
          FISSION_ENDLESS_MINUTES: ${{ inputs.minutes || '290' }}
        run: scripts/endless.sh 2000 0 python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endless-${{ matrix.job }}
          path: kernel/endless-results/
          if-no-files-found: ignore

  collect:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: endless-*
          path: ${{ runner.temp }}/incoming
      - name: Add this run to the test-results branch
        env:
          IN: ${{ runner.temp }}/incoming
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The code every round of this run tested, so old failures can be
          # told apart from current ones.
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin test-results >/dev/null; then
            git switch test-results
          else
            git switch --orphan test-results
          fi
          [ -f log.csv ] || echo "finished,seed,cases,harness,oracle_bodies,disagreements,seconds,run,commit,branch" >log.csv
          # Logs from before the commit column was added: widen the header
          # (their old rows just leave the last two columns empty).
          head -1 log.csv | grep -q ',commit,branch$' || sed -i '1s/$/,commit,branch/' log.csv
          short=$(echo "$COMMIT" | cut -c1-7)
          found=0 list=""
          for d in "$IN"/*/; do
            [ -f "$d/log.csv" ] && tail -n +2 "$d/log.csv" | sed "s|\$|,$RUN_URL,$short,$BRANCH|" >>log.csv
            for f in "$d"seed-*; do
              [ -d "$f" ] || continue
              mkdir -p failures && cp -r "$f" failures/
              echo "tested commit $COMMIT on branch $BRANCH ($RUN_URL)" >"failures/$(basename "$f")/commit.txt"
              found=$((found + 1))
              list="$list- failures/$(basename "$f"): $(grep -h -m1 'step\|line ' "$f/report.txt" "$f/oracle-disagreements.txt" 2>/dev/null | head -c 400)"$'\n'
            done
          done
          awk -F, -v now="$(date -u '+%Y-%m-%d %H:%M UTC')" 'NR > 1 {
              rounds++; cases += $3; fails += ($4 == "FAIL"); bodies += $5; dis += $6; secs += $7
              if ($4 == "FAIL" || $6 > 0) last = $1 " (seed " $2 ($9 ? ", commit " $9 " on " $10 : "") ")"
            } END {
              print "Fission random testing, all runs so far (updated " now ")"
              print ""
              printf "hours of testing:                 %.1f\n", secs / 3600
              print  "rounds:                           " rounds
              print  "random operation chains:          " cases
              print  "rounds where the harness failed:  " fails
              print  "bodies compared with OpenCascade: " bodies
              print  "OpenCascade disagreements:        " dis
              print  "last problem found:               " (last ? last : "none yet")
              print ""
              print "Every round is a line in log.csv. Each round that found a problem has a"
              print "folder in failures/ named after its seed: report.txt says what went wrong,"
              print "the .json file is the shortest chain of operations that shows it, and"
              print "failure-dumps/*/index.html is a 3D view with the problem in red."
              print "The commit and branch columns of log.csv (and commit.txt in each"
              print "failures folder) say which code a round tested."
            }' log.csv >summary.txt
          cat summary.txt >>"$GITHUB_STEP_SUMMARY"
          git add -A log.csv summary.txt failures 2>/dev/null || git add -A log.csv summary.txt
          git commit -qm "Random testing run ${{ github.run_id }}: $found round(s) found something" || exit 0
          for i in 1 2 3 4; do git push -q origin test-results && break; sleep $((2 ** i)); done
          if [ "$found" -gt 0 ]; then
            gh issue create --title "Random testing found $found problem(s)" --body "$(printf 'Run: %s (commit %s on %s)\n\n%s\nDetails are on the test-results branch, in the failures folder.\n' "$RUN_URL" "$short" "$BRANCH" "$list")"
          fi
