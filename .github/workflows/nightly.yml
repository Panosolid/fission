name: Random testing

# Tier 3 on GitHub's computers (free for public repos).
#
# Nightly, 11pm to 7am Perth (UTC+8, no daylight saving), so 15:00 to 23:00
# UTC, testing main: 8 parallel jobs run kernel/scripts/endless.sh (the
# stateful harness plus the OpenCascade oracle, a fresh random seed per round)
# in two legs, because a GitHub job may last at most 6 hours, until 22:35 UTC;
# alongside the first leg, 4 jobs run cargo mutants over the whole kernel
# (lib tests, one shard each: ~2600 mutants, ~75 minutes a shard). Every job
# is cut off at 22:35 UTC however late it started (GitHub sometimes starts
# scheduled runs late), so the last results are on the branch before 23:00
# UTC.
#
# "Run workflow" on the Actions tab (or workflow_dispatch from a thread) tests
# any branch: 4 jobs for `minutes`, mutation testing only if asked; the random
# rounds stop early, keeping every finished round, once the branch's pull
# request has merged or closed (.github/scripts/stop-on-merge.sh). Mutation
# shards are not held to `minutes`: a shard cut off part way says nothing
# about the code it didn't reach, so they get up to 330 minutes, like a
# nightly shard.
#
# A final job adds everything to the `test-results` branch
# (.github/scripts/collect-results.sh: log.csv, summary.txt, failures/<seed>/,
# mutants/), files one issue per kind of problem found
# (.github/scripts/file_issues.py: new kinds get an issue, known ones a
# comment, fixed ones that come back on main are reopened) and opens one for
# new mutation survivors. A journeys job walks the magic-moment journeys
# against tests/baseline.json (X8b) and its lines go into summary.txt.
# Scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: "0 15 * * *"
    # Extra back-to-back runs while Ben's Claude limit resets; the gate job
    # skips them after 2026-10-21 07:00 UTC, so nothing needs undoing.
    - cron: "5 3,9,21 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of random testing per job"
        default: "290"
      mutants:
        description: "Also run cargo mutants over the whole kernel"
        type: boolean
        default: false

# Read-only token by default; a job that writes says so itself.
permissions:
  contents: read

# The nightly run has its own group, and every branch its own, so runs started
# from threads during the day never cancel the night's run. A new run on a
# thread's branch cancels the one still running or waiting there, which tests
# older code (Ben, 2026-10-17, after day runs of 4 jobs × 290 minutes filled
# every runner and CI waited over an hour); runs on main and the nightly run
# are never cancelled. Runs on different branches do run at once; the
# collect script copes with that.
concurrency:
  group: random-testing-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "5 3,9,21 * * *" ] && [ "$(date -u +%s)" -ge "$(date -u -d 2026-10-21T07:00:00Z +%s)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
  plan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deadline: ${{ steps.plan.outputs.deadline }}
      mutants_deadline: ${{ steps.plan.outputs.mutants_deadline }}
      jobs: ${{ steps.plan.outputs.jobs }}
      second_leg: ${{ steps.plan.outputs.second_leg }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' }}
          MINUTES: ${{ inputs.minutes || '290' }}
          MUTANTS: ${{ inputs.mutants }}
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          now=$(date +%s)
          if [ "$NIGHTLY" = true ]; then
            # 22:35 UTC of the day the run started (it is meant to start at
            # 15:00 UTC, so this is the same UTC day).
            deadline=$(date -u -d "$(date -u +%F) 22:35" +%s)
            jobs="[0,1,2,3,4,5,6,7]" shards=4
          else
            deadline=$(( now + MINUTES * 60 ))
            jobs="[0,1,2,3]" shards=0
            [ "$MUTANTS" = true ] && shards=4
          fi
          # A leg lasts at most 315 minutes of testing (job limit 350); a second
          # leg runs when the first can't reach the deadline.
          second_leg=false
          [ $(( deadline - now )) -gt $(( 330 * 60 )) ] && second_leg=true
          # Mutation shards run in one job each (limit 350 minutes): at most
          # 330 minutes, and never past the night's deadline.
          mutants_deadline=$(( now + 330 * 60 ))
          [ "$NIGHTLY" = true ] && [ $deadline -lt $mutants_deadline ] && mutants_deadline=$deadline
          echo "Testing until $(date -u -d "@$deadline" '+%F %H:%M UTC'); second leg: $second_leg; mutation shards: $shards, until $(date -u -d "@$mutants_deadline" '+%H:%M UTC')"
          {
            echo "deadline=$deadline"
            echo "mutants_deadline=$mutants_deadline"
            echo "jobs=$jobs"
            echo "second_leg=$second_leg"
            echo "shards=$(if [ $shards -gt 0 ]; then seq -s, 0 $((shards - 1)) | sed 's/.*/[&]/'; else echo '[]'; fi)"
          } >>"$GITHUB_OUTPUT"

  test:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cadquery-ocp mpmath
      - name: Random rounds until the time is up
        working-directory: kernel
        env:
          DEADLINE: ${{ needs.plan.outputs.deadline }}
          # A run started from a push stops after the round in progress once
          # the branch's pull request has merged or closed: tonight's run on
          # main tests that code, and the runners go back to pull requests
          # (.github/scripts/stop-on-merge.sh; owner's decision, 2026-10-17).
          FISSION_ENDLESS_STOP_FILE: ${{ runner.temp }}/stop-random-testing
          GH_TOKEN: ${{ github.token }}
        run: |
          watcher=
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ]; then
            ../.github/scripts/stop-on-merge.sh "$GITHUB_REF_NAME" "$FISSION_ENDLESS_STOP_FILE" &
            watcher=$!
          fi
          code=0
          scripts/run-until.sh "$DEADLINE" || code=$?
          [ -z "$watcher" ] || kill "$watcher" 2>/dev/null || true
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: endless-a-${{ matrix.job }}
          path: kernel/endless-results/
          if-no-files-found: ignore

  test-second-leg:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.outputs.second_leg == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install cadquery-ocp mpmath
      - name: Random rounds until the time is up
        working-directory: kernel
        env:
          DEADLINE: ${{ needs.plan.outputs.deadline }}
          # A run started from a push stops after the round in progress once
          # the branch's pull request has merged or closed: tonight's run on
          # main tests that code, and the runners go back to pull requests
          # (.github/scripts/stop-on-merge.sh; owner's decision, 2026-10-17).
          FISSION_ENDLESS_STOP_FILE: ${{ runner.temp }}/stop-random-testing
          GH_TOKEN: ${{ github.token }}
        run: |
          watcher=
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" != main ]; then
            ../.github/scripts/stop-on-merge.sh "$GITHUB_REF_NAME" "$FISSION_ENDLESS_STOP_FILE" &
            watcher=$!
          fi
          code=0
          scripts/run-until.sh "$DEADLINE" || code=$?
          [ -z "$watcher" ] || kill "$watcher" 2>/dev/null || true
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: endless-b-${{ matrix.job }}
          path: kernel/endless-results/
          if-no-files-found: ignore

  mutants:
    needs: plan
    if: ${{ needs.plan.outputs.shards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutation testing, one shard of the whole kernel
        working-directory: kernel
        env:
          DEADLINE: ${{ needs.plan.outputs.mutants_deadline }}
          SHARDS: ${{ strategy.job-total }}
          # Unoptimised builds are about five times faster and give the same
          # result (kernel/CLAUDE.md, Mutation testing).
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          out="$RUNNER_TEMP/mutants"
          left=$(( DEADLINE - $(date +%s) ))
          code=124
          if [ $left -gt 60 ]; then
            code=0
            timeout -s INT -k 60 $left cargo mutants --shard ${{ matrix.shard }}/$SHARDS --sharding round-robin \
              -j 4 --output "$RUNNER_TEMP" -- --lib || code=$?
          fi
          mkdir -p "$out"
          cp "$RUNNER_TEMP"/mutants.out/*.txt "$out"/ 2>/dev/null || true
          echo $code >"$out/exit-code.txt"
          echo "cargo mutants exit code $code (0 all caught, 2 some missed, 3 some timed out, 124/130 cut off at the deadline)"
          grep -c . "$out"/caught.txt "$out"/missed.txt "$out"/timeout.txt "$out"/unviable.txt 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants/
          if-no-files-found: ignore

  # The magic-moment journeys (X8b, apps/fission/e2e/journeys.mjs) against
  # their baseline in tests/baseline.json: red on an extra click or a slowest
  # walk more than 15% over; the lines go into summary.txt either way.
  journeys:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      # apt-get inside --with-deps can stall on the Ubuntu mirror (it hung
      # #251's and #252's runs for 13 minutes): retry and time out each
      # fetch, and retry the whole install up to three times.
      - name: Install the browser (chromium)
        working-directory: apps/fission
        timeout-minutes: 20
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for i in 1 2 3; do
            timeout -k 15 300 npx playwright install --with-deps chromium && break
            [ "$i" = 3 ] && exit 1
            sleep 15
          done
      - name: Journeys against the baseline
        working-directory: apps/fission
        env:
          JOURNEY_NIGHTLY: "1"
          JOURNEY_REPORT: ${{ runner.temp }}/journeys/report.txt
        run: node --experimental-strip-types --no-warnings e2e/journeys.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: journeys
          path: ${{ runner.temp }}/journeys/
          if-no-files-found: ignore

  collect:
    needs: [gate, plan, test, test-second-leg, mutants, journeys]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/incoming
      - name: Add this run to the test-results branch
        env:
          IN: ${{ runner.temp }}/incoming
          MUTANT_SHARDS: ${{ needs.plan.outputs.shards == '[]' && '0' || '4' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The code every round of this run tested, so old failures can be
          # told apart from current ones.
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        # Copied out first: the script switches this checkout to test-results.
        run: |
          cp .github/scripts/collect-results.sh .github/scripts/file_issues.py "$RUNNER_TEMP/"
          bash "$RUNNER_TEMP/collect-results.sh"
