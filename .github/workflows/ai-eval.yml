name: AI eval

# The A10 check (docs/ai.md, AI3): scores small free models through Ollama on
# the evaluation suite. Run by hand (Actions > AI eval > Run workflow, with
# the models to score), and on pull requests that change the suite, the
# prompt or the providers. A measurement: it fails only if it can't run.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Ollama models to score, separated by spaces"
        default: "qwen2.5:1.5b llama3.2:3b gemma2:2b"
  pull_request:
    paths:
      - ".github/workflows/ai-eval.yml"
      - "packages/testing/scripts/ai-eval-ollama.ts"
      - "packages/testing/src/ai-eval.ts"
      - "packages/ai/src/prompt.ts"
      - "packages/ai/src/ollama.ts"
      - "packages/ai/src/commands.ts"

# Read-only token by default; a job that writes says so itself.
permissions:
  contents: read

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELS: ${{ inputs.models || 'qwen2.5:1.5b llama3.2:3b gemma2:2b' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
      - name: Pull the models
        run: for m in $MODELS; do ollama pull "$m"; done
      - name: Score them
        run: node --experimental-strip-types --no-warnings packages/testing/scripts/ai-eval-ollama.ts ai-eval.json $MODELS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-eval
          path: |
            ai-eval.json
            ollama.log
