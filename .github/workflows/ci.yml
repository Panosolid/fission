# Throwaway: proves e2e/leave-save.mjs fails WITHOUT the fix in Firefox and
# WebKit (main.ts as on main). Dispatch only; never open a pull request from
# this branch.
name: CI
on:
  workflow_dispatch:
jobs:
  browsers:
    name: nofix (${{ matrix.browser }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/fission
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 && echo "E2E_HEADED=1" >> "$GITHUB_ENV" && echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV" && echo "RUN=xvfb-run -a" >> "$GITHUB_ENV"
      - run: $RUN node e2e/leave-save.mjs
        working-directory: apps/fission
        env:
          E2E_BROWSER: ${{ matrix.browser }}
