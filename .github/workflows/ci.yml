name: CI

on:
  # Branches are tested by their pull request's run: a push run of the same
  # commit would repeat kernel, app, e2e, baseline and both browsers and hold nine
  # of the account's 20 runners for nothing.
  push:
    branches: [main]
  pull_request:
  # Once a day on main (6:45am Perth, after the night's random testing): the
  # whole suite on main itself, and the build caches every pull request's run
  # starts from (a cache saved on main is visible to every branch).
  schedule:
    - cron: "45 22 * * *"
  # Each merge queue group, tested in full on the exact commit that lands on
  # main (.github/scripts/ci_mode.py); main's ruleset counts these checks.
  merge_group:
  # By hand only: main's ruleset doesn't count a dispatched run's checks
  # for merging, so auto-merge.yml never starts one.
  workflow_dispatch:

# A newer commit on the same branch cancels the run still testing an older
# one: auto-merge only looks at the head's checks, so the old run's answer
# can't matter, and its runners go to the new run. main's runs always finish.
# The group names the repository the branch lives in, so a fork's pull
# request from a branch called main or claude/x can't cancel our runs, and
# the event, so a run started by hand can't cancel a pull request's own run
# (the only one main's ruleset counts). Tested in
# .github/scripts/test_ci_concurrency.py.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token by default; a job that writes says so itself.
permissions:
  contents: read

jobs:
  # Quick or full, and whether Firefox and WebKit run (.github/scripts/ci_mode.py).
  # A pull request's own run is quick only while main requires the merge
  # queue, which then runs the whole suite on the commit that merges. If this
  # job fails, the jobs below run in full (they test `!= 'false'`), never less.
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
      ui: ${{ steps.mode.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - id: mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/ci_mode.py

  # Required. Quick: clippy, the tests and the CI scripts' tests (about 2.5
  # minutes); full adds the same-answer and oracle checks (about 7).
  kernel:
    needs: mode
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: kernel
      - run: cargo test
        working-directory: kernel
      # Same answer everywhere: every saved fuzz input gives the same bits
      # natively and in the browser's WebAssembly (kernel/fuzz/same-answer/);
      # then the same check with a planted one-bit change must fail.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.mode.outputs.full != 'false'
        with:
          node-version: 24
      - run: fuzz/same-answer/check.sh
        if: needs.mode.outputs.full != 'false'
        working-directory: kernel
      - if: needs.mode.outputs.full != 'false'
        run: |
          out=$(SAME_ANSWER_BREAK=1 fuzz/same-answer/check.sh) && { echo "the planted break was not caught"; exit 1; }
          echo "$out" | grep "differ in: volume"
        working-directory: kernel
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install mpmath
      - run: python3 prototypes/vectors.py
      - run: python3 -m unittest discover -s .github/scripts
      - run: python3 -m unittest discover -s prototypes/oracle -p 'test_*.py'
        if: needs.mode.outputs.full != 'false'

  # Mutation testing of the kernel code this change touches: every mutant
  # cargo mutants makes in the changed lines must be caught by a lib test
  # (kernel/CLAUDE.md, Mutation testing). Equivalent mutants, which no test
  # can catch, are excluded in kernel/.cargo/mutants.toml with the reason.
  # A run started by hand (workflow_dispatch) runs it too.
  #
  # Three jobs: mutants-plan lists the mutants (no build) and picks how many
  # shards to split them across (one per 30 mutants, at most 8, none when no
  # kernel source changed); mutants-shard runs one share each, in parallel;
  # mutants-in-diff, the check auto-merge requires, fails if any shard failed
  # and lists every survivor in its summary.
  mutants-plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      - name: Count the mutants in the changed kernel code
        id: plan
        working-directory: kernel
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # Each pull request's own run already checked its changed lines; a
          # merge queue group adds none of its own, so it reports and passes.
          if [ "$EVENT" = merge_group ]; then
            echo "Merge queue: each pull request's own run checked the mutants in its changed kernel lines." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "count=0" >>"$GITHUB_OUTPUT"; echo "shards=[]" >>"$GITHUB_OUTPUT"; exit 0
          fi
          base=${BASE:-$(git merge-base origin/main HEAD)}
          git diff --relative "$base" HEAD -- src >"$RUNNER_TEMP/kernel.diff"
          count=0
          if [ -s "$RUNNER_TEMP/kernel.diff" ]; then
            cargo mutants --in-diff "$RUNNER_TEMP/kernel.diff" --list >"$RUNNER_TEMP/mutants.list"
            count=$(grep -c . "$RUNNER_TEMP/mutants.list" || true)
          fi
          shards=$(( (count + 29) / 30 )); [ $shards -gt 8 ] && shards=8
          echo "$count mutants in the kernel code changed since $base; $shards shards." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "count=$count" >>"$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($shards))))")" >>"$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/kernel.diff" kernel.diff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.count != '0'
        with:
          name: mutants-diff
          path: kernel/kernel.diff

  mutants-shard:
    needs: mutants-plan
    if: needs.mutants-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
          # One cache for every shard, written by shard 0 only.
          shared-key: mutants
          save-if: ${{ matrix.shard == 0 }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.149
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutants-diff
          path: ${{ runner.temp }}
      - name: Mutants in the changed kernel code, one shard
        working-directory: kernel
        env:
          SHARDS: ${{ strategy.job-total }}
          # Unoptimised builds are about five times faster and give the same
          # result (kernel/CLAUDE.md, Mutation testing).
          CARGO_PROFILE_DEV_OPT_LEVEL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        # One mutant at a time, in the checkout itself: each mutant then
        # rebuilds only the kernel crate (~2 s), where four copies each began
        # with a full build of every dependency (3-6 minutes). nextest runs
        # the lib tests on every core and stops at the first failure, so a
        # caught mutant takes seconds instead of waiting ~50 s for the
        # slowest test; a survivor still runs every test. The regressions
        # folder is read-only so proptest can't save a seed found against one
        # mutant and replay it against the next (it only warns).
        run: |
          chmod -R a-w tests/regressions
          code=0
          cargo mutants --in-diff "$RUNNER_TEMP/kernel.diff" --shard ${{ matrix.shard }}/$SHARDS --sharding round-robin \
            --in-place --test-tool nextest --output "$RUNNER_TEMP" -- --lib || code=$?
          out="$RUNNER_TEMP/mutants.out"
          mkdir -p "$RUNNER_TEMP/result"
          for f in caught missed timeout unviable; do cp "$out/$f.txt" "$RUNNER_TEMP/result/" 2>/dev/null || touch "$RUNNER_TEMP/result/$f.txt"; done
          echo "$code" >"$RUNNER_TEMP/result/exit-code"
          if [ -s "$out/missed.txt" ]; then cat "$out/missed.txt"; exit 1; fi
          # 0: all caught; 3: some timed out (a mutant that loops forever is
          # caught). Anything else (4: the unmutated tests failed) fails.
          case $code in 0 | 3) ;; *) echo "cargo mutants exit code $code"; exit 1 ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/result/

  mutants-in-diff:
    needs: [mutants-plan, mutants-shard]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.mutants-plan.outputs.count != '0' && needs.mutants-plan.outputs.count != ''
        with:
          pattern: mutants-shard-*
          path: ${{ runner.temp }}/shards
      - name: Combine the shards
        env:
          PLAN: ${{ needs.mutants-plan.result }}
          SHARD: ${{ needs.mutants-shard.result }}
          COUNT: ${{ needs.mutants-plan.outputs.count }}
          SHARDS: ${{ needs.mutants-plan.outputs.shards }}
        run: |
          echo "### Mutation testing of the changed kernel code" >>"$GITHUB_STEP_SUMMARY"
          if [ "$PLAN" != success ]; then echo "mutants-plan: $PLAN" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          if [ "$COUNT" = 0 ]; then echo "No mutants in the changed kernel code." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          dir="$RUNNER_TEMP/shards"
          expected=$(python3 -c "import json,sys; print(len(json.loads(sys.argv[1])))" "$SHARDS")
          got=$(ls -d "$dir"/mutants-shard-* 2>/dev/null | wc -l)
          {
            echo "$COUNT mutants across $expected shards ($got reported)."
            for f in caught missed timeout unviable; do echo "- $f: $(cat "$dir"/mutants-shard-*/$f.txt 2>/dev/null | grep -c .)"; done
            if cat "$dir"/mutants-shard-*/missed.txt 2>/dev/null | grep -q .; then
              echo; echo "Survivors (each needs a test, or an entry in kernel/.cargo/mutants.toml saying why it is equivalent):"
              cat "$dir"/mutants-shard-*/missed.txt | sed 's/^/    /'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Any shard that failed, was cancelled or never reported fails the
          # check, so a survivor can't slip through a lost shard.
          if [ "$SHARD" != success ] || [ "$got" != "$expected" ]; then echo "mutants-shard: $SHARD"; exit 1; fi

  # Which kernel code no test runs at all: a line-by-line report (HTML and
  # lcov artifacts) and a per-file table in the job summary. Report only, for
  # now; a floor goes into tests/baseline.json once that exists.
  coverage:
    if: github.event_name != 'merge_group' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
      - name: Kernel test coverage
        working-directory: kernel
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --summary-only | tee "$RUNNER_TEMP/coverage.txt"
          cargo llvm-cov report --lcov --output-path "$RUNNER_TEMP/lcov.info"
          cargo llvm-cov report --html --output-dir "$RUNNER_TEMP/coverage-html"
          { echo "### Kernel test coverage"; echo '```'; cat "$RUNNER_TEMP/coverage.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-coverage
          path: |
            ${{ runner.temp }}/coverage.txt
            ${{ runner.temp }}/lcov.info
            ${{ runner.temp }}/coverage-html/

  # Speed and memory against tests/baseline.json (.github/scripts/baseline.py):
  # kernel instructions (callgrind), heap and allocations fail past their
  # margin; app time only warns. The table is in the job summary.
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
      - run: npm ci
      - run: npm run kernel
        working-directory: apps/fission
      - run: python3 .github/scripts/baseline.py --save "$RUNNER_TEMP/measured.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: baseline-measured
          path: ${{ runner.temp }}/measured.json
          if-no-files-found: ignore

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
          # One cache of the WebAssembly build for every job that builds the app.
          shared-key: wasm
          # Saved by main's runs only: a branch's cache is visible to that branch
          # alone, main's to every branch.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        working-directory: apps/fission
      - run: npm run typecheck
      - run: npm run journeys

  # The Chromium browser checks (`npm run e2e`), split by e2e/shard.mjs into
  # shares that run side by side: one after another they took 15 minutes,
  # most of the wait for a merge. Every check runs in exactly one share
  # (e2e/shard.test.mjs, part of npm test above).
  e2e-shard:
    name: e2e (${{ matrix.shard }}/3)
    needs: mode
    if: ${{ !cancelled() && needs.mode.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
          shared-key: wasm
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      - run: npx playwright install --with-deps chromium
        working-directory: apps/fission
      - run: node e2e/shard.mjs ${{ matrix.shard }} 3
        working-directory: apps/fission
      # A golden image that no longer matches leaves the actual image and a diff (red where different).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-screenshots-chromium-${{ matrix.shard }}
          path: apps/fission/e2e/screenshots/*.*.png
          if-no-files-found: ignore

  # A quick pull request run's browser check: the whole-app smoke test in
  # Chromium (about a minute). The merge queue runs every share above before
  # merging. automerge.py never merges a head that only had this one.
  e2e-quick:
    name: e2e (quick)
    needs: mode
    if: needs.mode.outputs.full == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
          shared-key: wasm
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      - run: npx playwright install --with-deps chromium
        working-directory: apps/fission
      - run: node e2e/smoke.mjs
        working-directory: apps/fission
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-screenshots-chromium-quick
          path: apps/fission/e2e/screenshots/*.*.png
          if-no-files-found: ignore

  # The one e2e check auto-merge and main's ruleset wait for (REQUIRED_CHECKS
  # in .github/scripts/automerge.py). Full: green only when every share
  # passed. Quick: green when the smoke test passed. A failed, cancelled or
  # skipped job it needs, or a failed mode job, fails it.
  e2e:
    needs: [mode, e2e-shard, e2e-quick]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FULL: ${{ needs.mode.outputs.full }}
          SHARDS: ${{ needs.e2e-shard.result }}
          QUICK: ${{ needs.e2e-quick.result }}
        run: |
          if [ "$FULL" = false ]; then
            test "$QUICK" = success || { echo "the quick e2e check did not pass ($QUICK)"; exit 1; }
          else
            test "$SHARDS" = success || { echo "an e2e share did not pass ($SHARDS)"; exit 1; }
          fi

  # The sketch browser tests (and, reported only, the smoke test) in the other two engines
  # people use: Firefox and WebKit (Safari's engine). Pixel probes run in
  # all three; golden images are Chromium's only (testing catch-up TC4).
  # Reported, not required: on pull requests that change app files (ci_mode.py,
  # `ui`), and on main's daily run; not in the merge queue, which only
  # waits for the required checks.
  browsers:
    name: browsers (${{ matrix.browser }})
    needs: mode
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.mode.outputs.ui != 'false' }}
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
          shared-key: wasm
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/fission
      # Firefox finds no GL driver headless on CI: it runs with a window on a
      # virtual screen, drawing with Mesa's software GL (e2e/browser.mjs).
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 && echo "E2E_HEADED=1" >> "$GITHUB_ENV" && echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV" && echo "RUN=xvfb-run -a" >> "$GITHUB_ENV"
      - run: $RUN npm run e2e:engines
        working-directory: apps/fission
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      # The whole-app smoke test in this engine, reported but not yet required:
      # its first run here found engine differences (docs/progress/cad.md, TC4)
      # that are other workstreams' to fix; this step goes required once they are.
      - run: $RUN node e2e/smoke.mjs
        if: always()
        continue-on-error: true
        working-directory: apps/fission
        env:
          E2E_BROWSER: ${{ matrix.browser }}
