name: CI

# Bug-hunt branch only (step-24 timeline hunt): replays the hunt's findings in
# Firefox and WebKit. Never merged; no pull request is opened from this branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt:
    name: hunt (${{ matrix.browser }})
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
        working-directory: apps/fission
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/fission
      - if: matrix.browser == 'firefox'
        run: sudo apt-get install -y -qq xvfb libgl1-mesa-dri libegl1 && echo "E2E_HEADED=1" >> "$GITHUB_ENV" && echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV" && echo "RUN=xvfb-run -a" >> "$GITHUB_ENV"
      - run: $RUN node e2e/hunt/engines.mjs
        working-directory: apps/fission
        env:
          E2E_BROWSER: ${{ matrix.browser }}
