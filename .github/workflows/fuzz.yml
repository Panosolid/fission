name: Fuzzing

# Fuzzing on GitHub's computers (free for public repos): the file readers,
# the STL reader (kernel/tests/fuzz_stl.rs) and the project loader
# (packages/testing/src/project-fuzz.ts), each broken files by the thousand
# checked against a simple model, a fresh seed every round of 2,000 inputs.
# Alongside them, simulated users sketching and extruding on the real kernel
# (packages/testing/fuzz/sketch-extrude.ts, rounds of 50 sessions × 40
# steps against the sessions' own model), then up to 20,000 of the extrudes
# they built compared with exact values and OpenCascade
# (prototypes/oracle/sketch_extrude.py; a disagreement is a failure folder
# with oracle-disagreements.txt). Design's timeline on the real kernel in
# long sessions (packages/testing/fuzz/timeline.ts, step 25b3: rounds of 5
# sessions × 500 steps against the timeline model, failures shrunk to the
# fewest steps; each round's simulated-user numbers, Tier 3 item 4, go to
# numbers.jsonl and the summary, step 30d). And the kernel's entry points (extrude,
# sketch outline, moves and turns) with coverage-guided fuzzing
# (kernel/fuzz/, cargo-fuzz on nightly Rust), every body their corpus builds
# then compared with exact values and OpenCascade
# (prototypes/oracle/fuzz_shapes.py). Both oracles also have OpenCascade
# read every body from its STEP file as the kernel wrote it (step 29b3,
# compare.py's step_issues), and each job then plants a flipped face in
# every file of a short run (FISSION_STEP_FAULT), which must be caught in
# every body (`--planted`), so a check that stopped working fails the job.
#
# Nightly at 23:10 UTC (7:10am Perth), after the random testing run
# (nightly.yml, 15:00 to 22:35 UTC, collected by about 22:50) so the two
# never compete for runners or push to test-results at once; 45 minutes a
# reader or kernel target, so results are in by about 8am Perth. "Run workflow" on the
# Actions tab tests any branch for `minutes`.
#
# A final job adds the rounds to the test-results branch
# (.github/scripts/collect-fuzz.sh: fuzz/log.csv, fuzz/summary.txt, and
# fuzz/failures/seed-<seed>/ with fuzz-report.txt and the shrunk inputs) and
# files one issue per kind of problem, as random testing does
# (.github/scripts/file_issues.py). Scheduled runs only fire from the default
# branch.
on:
  schedule:
    - cron: "10 23 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of fuzzing per reader"
        default: "45"

# Read-only token by default; a job that writes says so itself.
permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

jobs:
  stl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - name: Fuzz the STL reader until the time is up
        working-directory: kernel
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        # A debug build (the tests' own profile), so overflow checks are on.
        # The job fails when a round found something; collect still runs.
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          cargo test --test fuzz_stl --no-run
          FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) cargo test --test fuzz_stl fuzz_stl_random -- --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-stl
          path: ${{ runner.temp }}/fuzz/
          if-no-files-found: ignore

  project:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Fuzz the project loader until the time is up
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) npm run fuzz -w @fission/testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-project
          path: ${{ runner.temp }}/fuzz/
          if-no-files-found: ignore

  sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run kernel -w @fission/app
      - name: Sketch and extrude sessions until the time is up
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) npm run sessions -w @fission/testing
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: always()
        with:
          python-version: "3.12"
      - name: Compare the extrudes with exact values and OpenCascade
        if: always()
        env:
          OUT: ${{ runner.temp }}/fuzz
        working-directory: prototypes/oracle
        run: |
          [ -f "$OUT/oracle.jsonl" ] || exit 0
          pip install -q cadquery-ocp mpmath
          if ! python3 sketch_extrude.py "$OUT/oracle.jsonl" "$OUT/disagreements.txt"; then
            mkdir -p "$OUT/seed-oracle-${{ github.run_id }}"
            mv "$OUT/disagreements.txt" "$OUT/seed-oracle-${{ github.run_id }}/oracle-disagreements.txt"
            exit 1
          fi
      # The STEP check's self-test: a minute of sessions with a face flipped
      # in every file, each of which the oracle must report.
      - name: The oracle catches a planted flipped face in every session's STEP file
        if: always()
        env:
          PLANTED: ${{ runner.temp }}/planted
        run: |
          FISSION_STEP_FAULT=1 FISSION_FUZZ_SECONDS=60 FISSION_FUZZ_OUT="$PLANTED" npm run sessions -w @fission/testing
          cd prototypes/oracle && python3 sketch_extrude.py "$PLANTED/oracle.jsonl" "$PLANTED/disagreements.txt" --planted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-sessions
          path: |
            ${{ runner.temp }}/fuzz/log.csv
            ${{ runner.temp }}/fuzz/seed-*/
          if-no-files-found: ignore

  kernel:
    # Coverage-guided fuzzing (libFuzzer via cargo-fuzz) of the kernel's
    # entry points: kernel/fuzz/checks.rs, one job per target. Starts from
    # the committed seeds (kernel/fuzz/seeds/), so each night continues
    # from code the fuzzer already reaches instead of from nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [extrude, sketch, placed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel/fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz until the time is up
        working-directory: kernel
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          fuzz/run.sh ${{ matrix.target }} $(( MINUTES * 60 )) "$RUNNER_TEMP/fuzz"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: always()
        with:
          python-version: "3.12"
      # Every body the corpus builds (the seeds, the saved crashes and
      # tonight's finds) and random inputs build, rebuilt in OpenCascade and checked against exact
      # volume, area and crossings (prototypes/oracle/fuzz_shapes.py); a
      # disagreement is a failure folder with oracle-disagreements.txt.
      - name: Compare the fuzzed bodies with exact values and OpenCascade
        if: always()
        working-directory: kernel
        env:
          FISSION_ORACLE_TARGET: ${{ matrix.target }}
          FISSION_ORACLE_CORPUS: fuzz/corpus
          FISSION_ORACLE_OUT: ${{ runner.temp }}/oracle.jsonl
          # Plus 20,000 random inputs, seeded by the run (replay with the same
          # FISSION_SEED and FISSION_ORACLE_RANDOM).
          FISSION_ORACLE_RANDOM: "20000"
          FISSION_SEED: ${{ github.run_id }}
        run: |
          cargo test --test fuzz_corpus oracle_cases
          pip install -q cadquery-ocp mpmath
          if ! python3 ../prototypes/oracle/fuzz_shapes.py "$FISSION_ORACLE_OUT" "$RUNNER_TEMP/disagreements.txt"; then
            dir="$RUNNER_TEMP/fuzz/seed-oracle-${{ matrix.target }}-${{ github.run_id }}"
            mkdir -p "$dir"
            mv "$RUNNER_TEMP/disagreements.txt" "$dir/oracle-disagreements.txt"
            exit 1
          fi
      # The STEP check's self-test: the saved seeds' bodies with a face
      # flipped in every file, each of which the oracle must report.
      - name: The oracle catches a planted flipped face in every fuzz body's STEP file
        if: always()
        working-directory: kernel
        env:
          FISSION_ORACLE_TARGET: ${{ matrix.target }}
          FISSION_ORACLE_OUT: ${{ runner.temp }}/planted.jsonl
          FISSION_STEP_FAULT: "1"
        run: |
          cargo test --test fuzz_corpus oracle_cases
          python3 ../prototypes/oracle/fuzz_shapes.py "$FISSION_ORACLE_OUT" "$RUNNER_TEMP/planted.txt" --planted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-kernel-${{ matrix.target }}
          path: ${{ runner.temp }}/fuzz/
          if-no-files-found: ignore

  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: kernel
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run kernel -w @fission/app
      - name: Long timeline sessions until the time is up
        env:
          MINUTES: ${{ inputs.minutes || '45' }}
          FISSION_FUZZ_OUT: ${{ runner.temp }}/fuzz
        run: |
          case $MINUTES in ""|*[!0-9]*) echo "minutes must be a whole number"; exit 1;; esac
          FISSION_FUZZ_SECONDS=$(( MINUTES * 60 )) npm run timeline-fuzz -w @fission/testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-timeline
          path: ${{ runner.temp }}/fuzz/
          if-no-files-found: ignore

  collect:
    needs: [stl, project, sessions, timeline, kernel]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/incoming
      - name: Add this run to the test-results branch and file issues
        env:
          IN: ${{ runner.temp }}/incoming
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        # Copied out first: the script switches this checkout to test-results.
        run: |
          cp .github/scripts/collect-fuzz.sh .github/scripts/file_issues.py .github/scripts/sim_numbers.py "$RUNNER_TEMP/"
          bash "$RUNNER_TEMP/collect-fuzz.sh"
